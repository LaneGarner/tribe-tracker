name: Frontend regression

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: TypeScript, tests, exports, and browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run Jest suite
        run: npm run test:ci

      - name: Export production web bundle
        run: npm run export:ci:web

      - name: Resolve iOS production bundle
        run: npm run export:ci:ios

      - name: Resolve Android production bundle
        run: npm run export:ci:android

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production web E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
